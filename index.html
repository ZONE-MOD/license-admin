<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>License Admin - Login</title>

  <!-- Prevent browser caching -->
  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at top,
          #10243a 0%,
          #07111f 45%,
          #040b14 100%
        );

      color: #e6edf3;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .login-box {

      width: calc(100% - 32px);
      max-width: 420px;

      padding: 32px;

      background: rgba(13, 27, 42, 0.96);

      border: 1px solid #1d344a;

      border-radius: 16px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(10px);
    }

    .logo {

      width: 58px;
      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 18px;

      border-radius: 14px;

      background: #123d30;

      color: #21c77a;

      font-size: 26px;
      font-weight: bold;

      border: 1px solid #1d654c;
    }

    h1 {

      margin: 0 0 8px;

      font-size: 27px;

      font-weight: 700;

      letter-spacing: 0.2px;
    }

    .subtitle {

      margin-bottom: 28px;

      color: #8fa3b8;

      font-size: 14px;

      line-height: 1.5;
    }

    label {

      display: block;

      margin-bottom: 9px;

      color: #c9d5e1;

      font-size: 14px;

      font-weight: 600;
    }

    input {

      width: 100%;

      padding: 14px 15px;

      border: 1px solid #29445c;

      border-radius: 9px;

      outline: none;

      background: #081522;

      color: #ffffff;

      font-size: 15px;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    input::placeholder {
      color: #617487;
    }

    input:focus {

      border-color: #21c77a;

      box-shadow:
        0 0 0 3px rgba(
          33,
          199,
          122,
          0.12
        );
    }

    button {

      width: 100%;

      margin-top: 18px;

      padding: 14px;

      border: none;

      border-radius: 9px;

      background: #16a765;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.05s ease,
        opacity 0.15s ease;
    }

    button:hover {
      background: #128b55;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {

      opacity: 0.65;

      cursor: not-allowed;
    }

    #loginMessage {

      min-height: 22px;

      margin-top: 16px;

      color: #ff6b6b;

      font-size: 14px;

      line-height: 1.5;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .footer {

      margin-top: 22px;

      color: #566a7d;

      font-size: 12px;

      text-align: center;
    }

    @media (max-width: 480px) {

      .login-box {

        padding: 24px;

        border-radius: 13px;
      }

      h1 {
        font-size: 24px;
      }

    }

  </style>

</head>

<body>

  <main class="login-box">

    <div class="logo">
      LM
    </div>

    <h1>
      License Admin
    </h1>

    <div class="subtitle">
      Administrator Login
    </div>

    <form
      id="loginForm"
      autocomplete="off"
      novalidate
    >

      <label for="password">
        Admin Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Enter admin password"
        required
      >

      <button
        id="loginButton"
        type="submit"
      >
        Login
      </button>

      <div
        id="loginMessage"
        role="alert"
        aria-live="polite"
      ></div>

    </form>

    <div class="footer">
      Secure Administrator Panel
    </div>

  </main>


  <!--
    IMPORTANT:
    Add a unique timestamp to app.js.
    This prevents the browser from using
    an old cached JavaScript file.
  -->

  <script>

    (function () {

      const script =
        document.createElement("script");

      script.src =
        "app.js?v=" +
        Date.now();

      script.async = false;

      document.body.appendChild(script);

    })();

  </script>

</body>
</html>
