<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>License Admin - Login</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#07111f;
  color:#e6edf3;
  font-family:Arial,Helvetica,sans-serif;
}
.login-box{
  width:calc(100% - 32px);
  max-width:420px;
  padding:30px;
  background:#0d1b2a;
  border:1px solid #1d344a;
  border-radius:14px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}
h1{margin:0 0 8px;font-size:26px}
.subtitle{margin-bottom:25px;color:#8fa3b8;font-size:14px}
label{display:block;margin-bottom:8px;font-size:14px}
input{
  width:100%;
  padding:13px;
  border:1px solid #29445c;
  border-radius:8px;
  background:#081522;
  color:#fff;
  outline:none;
  font-size:15px;
}
input:focus{border-color:#21c77a}
button{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#16a765;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#128b55}
button:disabled{opacity:.6;cursor:not-allowed}
#loginMessage{
  min-height:22px;
  margin-top:16px;
  color:#ff6b6b;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="login-box">

<h1>License Admin</h1>

<div class="subtitle">
Administrator Login
</div>

<form id="loginForm" autocomplete="off">

<label for="password">
Admin Password
</label>

<input
id="password"
name="password"
type="password"
autocomplete="off"
autocapitalize="off"
autocorrect="off"
spellcheck="false"
placeholder="Enter admin password"
required
>

<button id="loginButton" type="submit">
Login
</button>

<div id="loginMessage"></div>

</form>

</div>

<script>
(async()=>{
try{
 if("serviceWorker" in navigator){
   const r=await navigator.serviceWorker.getRegistrations();
   await Promise.all(r.map(x=>x.unregister()));
 }
 if("caches" in window){
   const k=await caches.keys();
   await Promise.all(k.map(x=>caches.delete(x)));
 }
}catch{}

const s=document.createElement("script");
s.src="app.js?v="+Date.now();
s.async=false;
document.body.appendChild(s);
})();
</script>

</body>
</html>
